<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Watch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header -->
<header>
    <h1>Eva Store</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Features</a>
        <a href="#">Contact</a>
    </nav>
</header>

<!-- Hero Section -->
<section class="hero">
    <div class="hero-text">
        <h2>Smart Watch X</h2>
        <p>Track your fitness, stay connected, and look stylish.</p>
        <h3>$99</h3>
        <button>Buy Now</button>
    </div>
    <div class="hero-img">
        <img src="watch.jpg" alt="watch">
    </div>
</section>
<!-- Features -->
<section class="features">
    <h2 class="a">Features</h2>
    <div class="feature-box">
        <div class="card">🔋 Long Battery</div>
        <div class="card">💧 Waterproof</div>
        <div class="card">❤️ Heart Monitor</div>
    </div>
</section>

<!-- Gallery -->
<section class="gallery">
    <h2>Gallery</h2>
    <div class="images">
        <img src="cent.jpg">
        <img src="ciram.jpg">
        <img src="oil.jpg">
    </div>
</section>

<!-- Footer -->
<footer>
    <p>Contact: evastore@email.com</p>
</footer>

</body>
</html>
